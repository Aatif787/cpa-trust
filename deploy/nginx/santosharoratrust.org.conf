# ==============================================================================
# Nginx site: santosharoratrust.org  ->  Next.js on 127.0.0.1:3001
#
# Install:
#   sudo cp deploy/nginx/santosharoratrust.org.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/santosharoratrust.org.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d santosharoratrust.org -d www.santosharoratrust.org --redirect
#
# This file is HTTP-only on purpose. Certbot adds the `listen 443 ssl` lines,
# the certificate paths and the HTTP -> HTTPS redirect for you.
# Canonical host is the bare domain; www.* permanently redirects to it.
# ==============================================================================

upstream santosharoratrust_app {
    server 127.0.0.1:3001;
    keepalive 16;
}

# www.santosharoratrust.org -> santosharoratrust.org
server {
    listen 80;
    listen [::]:80;
    server_name www.santosharoratrust.org;

    return 301 https://santosharoratrust.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name santosharoratrust.org;

    access_log /var/log/nginx/santosharoratrust.org.access.log;
    error_log  /var/log/nginx/santosharoratrust.org.error.log warn;

    # Contact form payloads are capped at 24 KB by the app.
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets: Next.js already sends immutable cache headers.
    location /_next/static/ {
        include snippets/nextjs-proxy.conf;
        proxy_pass http://santosharoratrust_app;
    }

    location / {
        include snippets/nextjs-proxy.conf;
        proxy_pass http://santosharoratrust_app;
    }
}
